# How a secondary WROLPi copies this WROLPi's library: an rsync daemon that serves the media directory read-only.
# The library is no more private here than it is over HTTPS at /media/.
#
# One file for every deployment: the systemd unit reads it on a Raspberry Pi and on Debian, and the Controller hands
# it to the helper container in Docker (see controller/lib/rsyncd.py).
port = 8873
# Run as the unprivileged wrolpi user: no chroot, and no connection limit (which needs a lock file under /var/run).
use chroot = no
log file = /dev/stderr

[media]
    path = /media/wrolpi
    read only = yes
    list = yes
    # A symbolic link is sent as a link.  Asked to follow links while it copies a directory, the daemon would send
    # the files left out below through a link to them from elsewhere in the library.  (A link that is itself part of
    # the path a client asks for is still followed: the files below are left out by where they are, nothing more.)
    refuse options = copy-links copy-unsafe-links copy-dirlinks
    # Never served: this machine's TLS keys, VPN keys and login, and cookies, and the database in use (a copy of a database that is
    # being written can be torn; a secondary copies the snapshot under config/.sync instead), and a snapshot that
    # is still being written.
    exclude = /config/ssl/ /config/vpn/ /config/cookies.txt /config/cookies.txt.enc /config/wrolpi.db /config/wrolpi.db-wal /config/wrolpi.db-shm /config/wrolpi.db.lock .wrolpi.db.backup /lost+found/
