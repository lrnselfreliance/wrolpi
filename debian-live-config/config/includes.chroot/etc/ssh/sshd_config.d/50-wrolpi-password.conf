# Allow password SSH, as on every other WROLPi.  On a Live USB, live-config
# (1160-openssh-server) rewrites sshd_config to "PasswordAuthentication no" at
# each boot; sshd uses the first value it reads, and sshd_config includes this
# directory before that line, so this wins.  The live session's login is
# user / live (live-config's default password).  On an installed system this
# matches Debian's default.
PasswordAuthentication yes
