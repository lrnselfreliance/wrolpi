# Debian installer defaults.  live-build copies this into the installer's
# initrd, where d-i loads /preseed.cfg automatically.
#
# Default the hostname to wrolpi (Debian's default is "debian") so
# wrolpi.local works after install.  "seen false" keeps the question on screen,
# so it can still be changed; a hostname from DHCP takes precedence.
d-i netcfg/get_hostname string wrolpi
d-i netcfg/get_hostname seen false
