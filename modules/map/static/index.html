<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WROLPi Map</title>
    <link rel="stylesheet" href="/libs/maplibre-gl.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        #map { width: 100%; height: 100%; }

        /* Layer control panel */
        #layer-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 1000;
            max-height: calc(100vh - 20px);
            overflow-y: auto;
            min-width: 220px;
            font-size: 14px;
        }

        #layer-toggle {
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            user-select: none;
        }
        #layer-toggle:hover { background: #f5f5f5; }
        #layer-toggle .arrow { transition: transform 0.2s; }
        #layer-toggle .arrow.collapsed { transform: rotate(-90deg); }

        #layer-content { padding: 8px 0; }
        #layer-content.hidden { display: none; }

        .layer-group { padding: 4px 14px; }
        .layer-group-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
            cursor: pointer;
            font-weight: 500;
            user-select: none;
        }
        .layer-group-header:hover { color: #1a73e8; }
        .layer-group-header input { cursor: pointer; width: 16px; height: 16px; }

        /* Overlays: map files which are not the basemap, each with its own layers. */
        #overlay-section { border-top: 1px solid #eee; margin-top: 4px; padding-top: 4px; }
        #overlay-section h4 { padding: 4px 14px; font-size: 13px; }
        .overlay-file { display: flex; align-items: center; gap: 6px; padding: 4px 14px; }
        .overlay-file label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .overlay-file input, .overlay-layer input { cursor: pointer; width: 16px; height: 16px; }
        .overlay-zooms { color: #888; font-size: 11px; }
        .overlay-expand {
            margin-left: auto; border: none; background: none; cursor: pointer;
            font-size: 12px; color: #555; padding: 2px 4px;
        }
        .overlay-layers { padding: 0 14px 4px 38px; font-size: 13px; }
        .overlay-layers .overlay-note { color: #888; font-size: 11px; padding: 2px 0; }
        .overlay-all-none { display: flex; gap: 8px; padding: 2px 0; }
        .overlay-all-none button {
            border: none; background: none; cursor: pointer; padding: 0;
            color: #888; font-size: 11px; text-decoration: underline;
        }
        .overlay-layer { display: flex; align-items: center; gap: 6px; padding: 1px 0; cursor: pointer; }
        .overlay-layer.disabled { color: #aaa; }
        .overlay-swatch { width: 10px; height: 10px; flex: none; border: 1px solid #ccc; }

        /* File selector */
        #file-panel {
            position: absolute;
            top: 10px;
            right: 50px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 1000;
            padding: 10px 14px;
            font-size: 14px;
            max-width: 300px;
        }
        #file-panel h3 { margin-bottom: 8px; font-size: 14px; }
        .file-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 0;
        }
        .file-item input { cursor: pointer; width: 16px; height: 16px; }
        .file-item label { cursor: pointer; word-break: break-all; }

        #no-files-msg {
            color: #888;
            font-style: italic;
            padding: 4px 0;
        }

        /* Status bar */
        #status {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 1000;
            display: none;
        }

        /* Context menu */
        #context-menu {
            position: absolute;
            z-index: 1001;
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            padding: 4px 0;
            font-size: 13px;
            min-width: 180;
            display: none;
        }
        #context-menu .coords {
            padding: 6px 12px;
            color: #666;
            font-size: 12px;
            border-bottom: 1px solid #eee;
        }
        #context-menu .action {
            padding: 8px 12px;
            cursor: pointer;
            user-select: none;
        }
        #context-menu .action:hover { background: #f0f0f0; }

        /* Search */
        #search-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 320px;
            max-width: calc(100% - 100px);
        }
        #search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        #search-results {
            display: none;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 4px 4px;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .search-result {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .search-result:hover { background: #f0f0f0; }
        .search-result-name { font-weight: 500; }
        .search-result-kind { font-size: 11px; color: #888; }
    </style>
</head>
<body>
<div id="map"></div>

<div id="layer-panel">
    <div id="layer-toggle">
        <span>Layers</span>
        <span class="arrow">&#9660;</span>
    </div>
    <div id="layer-content"></div>
</div>

<div id="file-panel">
    <h3>Map Files</h3>
    <div id="file-list">
        <div id="no-files-msg">Scanning...</div>
    </div>
</div>

<div id="status"></div>

<div id="search-container">
    <input type="text" id="search-input" placeholder="Search places...">
    <div id="search-results"></div>
</div>

<div id="context-menu">
    <div class="coords" id="context-coords"></div>
    <div class="action" id="context-copy">Copy GPS coordinates</div>
    <div class="action" id="context-export">Export as PNG</div>
</div>

<script src="/libs/pmtiles.js"></script>
<script src="/libs/maplibre-gl.js"></script>
<script src="/libs/protomaps-themes-base.js"></script>
<script src="/libs/maplibre-contour-pmtiles.js"></script>
<script>
(function() {
    // --- Constants ---
    var MAP_OVERVIEW_URL = "/blobs/map-overview.pmtiles";
    var TERRAIN_PREFIX = "terrain-";

    // The URL path of a map file.  Each part of its path is encoded: a `#` or `?` in a file name
    // would otherwise end the path, and another file (or none) would be asked for.
    function dataPath(mapPath) {
        return "/data/" + String(mapPath).split("/").map(encodeURIComponent).join("/");
    }

    function isPlanetFile(name) {
        if (name.indexOf("planet-") === 0) return true;
        return /^\d{8}\.pmtiles$/.test(name);
    }
    var terrainFileName = null;
    var STORAGE_KEY_LAYERS = "wrolpi-map-layers";
    var STORAGE_KEY_SCALE = "wrolpi-map-scale";
    var DEFAULT_HIDDEN = {"Hillshade": true, "Contours": true};

    // --- PMTiles protocol ---
    var protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    // --- Layer group definitions ---
    var LAYER_GROUPS = {
        "Hillshade": ["hillshade"],
        "Contours": ["contour-lines", "contour-labels"],
        "Water": ["water"],
        "Land Cover": [
            "landcover", "landuse_park", "landuse_urban_green", "landuse_beach",
            "landuse_aerodrome", "landuse_hospital", "landuse_industrial",
            "landuse_pedestrian", "landuse_pier", "landuse_school", "landuse_zoo"
        ],
        "Buildings": ["buildings"],
        "Roads - Highway": ["roads_highway"],
        "Roads - Major": ["roads_major", "roads_link"],
        "Roads - Minor": ["roads_minor", "roads_other"],
        "Roads - Tunnels": ["roads_tunnels"],
        "Roads - Bridges": ["roads_bridges"],
        "Rail & Runways": ["roads_rail", "roads_runway", "roads_taxiway", "landuse_runway"],
        "Boundaries": ["boundaries"],
        "Labels": ["roads_labels", "places_", "address_label", "pois", "water_label", "water_waterway_label"],
    };

    // --- State ---
    var map;
    var scaleControl;
    var demSource = null;
    var activeSources = {};
    var hasPlanetOverview = false;
    var hasTerrain = false;
    var contextMenuData = null;

    // --- Overlays: map files which are not a basemap ---
    // The logic is the map viewer's own (app/src/map-shared), loaded from the copies in /js/.  Until
    // it has loaded (or if it cannot be), this viewer draws basemaps only.
    var Overlays = null;
    var OverlayStyle = null;
    // The overlay files; one which came with a style has `styleLayers`.
    var overlayFiles = [];
    // What the user chose to see: {[map_path]: {enabled, layers: {[layerId]: bool}}}.
    var overlayState = {};
    // Which overlay files have their layers listed in the panel.
    var overlayExpanded = {};
    // How many layers of each file MapLibre refused, by map_path.
    var overlayRefused = {};
    // This viewer is served the map directory at /data/, not the media directory.
    var OVERLAY_URLS = {
        pmtiles: function(file) { return "pmtiles://" + dataPath(file.map_path); },
        style: function(file) { return dataPath(file.style_map_path); },
    };

    function loadOverlays(files) {
        if (!files.length) return Promise.resolve();
        return Promise.all([import("/js/overlays.js"), import("/js/overlayStyle.js")])
            .then(function(modules) {
                Overlays = modules[0];
                OverlayStyle = modules[1];
                overlayState = Overlays.loadOverlayState();
                // No `validateLayer`: this viewer cannot check a layer first, so each is added to
                // the map by itself (see applyOverlays).
                return OverlayStyle.loadOverlayStyles(files, {urls: OVERLAY_URLS});
            })
            .then(function(files) { overlayFiles = files; })
            .catch(function(err) {
                console.error("Overlays are not available:", err);
                overlayFiles = [];
            });
    }

    // Add the overlays to the map.  The style must have loaded; a new style has none of them.
    function applyOverlays() {
        if (!Overlays || !overlayFiles.length || !map) return;
        // An overlay drawn with a style of its own names icons: the map's overlay icons, a
        // second sprite beside the basemap's.  It is only asked for when there is such an overlay.
        if (overlayFiles.some(Overlays.isStyledOverlay)) {
            var id = OverlayStyle.OVERLAY_ICONS_SPRITE_ID;
            try {
                var has = (map.getSprite() || []).some(function(sprite) { return sprite.id === id; });
                if (!has) map.addSprite(id, window.location.origin + "/sprites/" + id);
            } catch (e) { console.warn("Could not add the overlay icons", e); }
        }
        overlayRefused = Overlays.addOverlaysToMap(map, overlayFiles, overlayState, OVERLAY_URLS);
    }

    // Remember what the user chose to see of an overlay, and show or hide its layers to match.
    function changeOverlayState(file, next) {
        overlayState = next;
        Overlays.saveOverlayState(next);
        if (map && map.getStyle()) {
            Overlays.buildOverlayLayers(file, next).forEach(function(layer) {
                if (map.getLayer(layer.id)) {
                    map.setLayoutProperty(layer.id, "visibility", layer.layout.visibility);
                }
            });
        }
        buildLayerControls();
    }

    function overlayLayerIds() {
        if (!Overlays || !map || !map.getStyle()) return [];
        return (map.getStyle().layers || [])
            .filter(function(l) { return Overlays.isOverlayLayerId(l.id) && l.type !== "raster"; })
            .map(function(l) { return l.id; });
    }

    // Load saved state from localStorage.
    function getSavedVisibility() {
        try {
            var saved = localStorage.getItem(STORAGE_KEY_LAYERS);
            if (saved) return JSON.parse(saved);
        } catch(e) {}
        var v = {};
        for (var g in LAYER_GROUPS) v[g] = !DEFAULT_HIDDEN[g];
        return v;
    }
    function getSavedScale() {
        try { return localStorage.getItem(STORAGE_KEY_SCALE) || "metric"; } catch(e) { return "metric"; }
    }

    var groupVisibility = getSavedVisibility();
    var currentScale = getSavedScale();

    function getMapFlavor() {
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    // --- Build style ---
    function buildStyle() {
        var flavor = getMapFlavor();
        var skipSecondary = {"background": true, "earth": true};
        var sources = {};
        var allLayers = [];
        var si = 0;

        // Planet overview as the primary base layer.
        if (hasPlanetOverview) {
            sources["map-overview"] = {
                type: "vector",
                url: "pmtiles://" + MAP_OVERVIEW_URL,
            };
            var baseLayers = protomaps_themes_base.default("map-overview", flavor);
            allLayers = allLayers.concat(baseLayers);
            si = 1;
        }

        // User files as additional sources.
        var sourceNames = Object.keys(activeSources);
        for (var fi = 0; fi < sourceNames.length; fi++) {
            var filename = sourceNames[fi];
            sources[filename] = {
                type: "vector",
                url: "pmtiles://" + dataPath(filename),
            };
            var fileLayers = protomaps_themes_base.default(filename, flavor);
            if (si === 0 && fi === 0) {
                allLayers = allLayers.concat(fileLayers);
            } else {
                for (var li = 0; li < fileLayers.length; li++) {
                    if (skipSecondary[fileLayers[li].id]) continue;
                    var layer = Object.assign({}, fileLayers[li]);
                    layer.id = filename + ":" + layer.id;
                    allLayers.push(layer);
                }
            }
        }

        // Terrain (hillshade + contours).
        if (hasTerrain && demSource) {
            var savedVis = getSavedVisibility();
            var hillshadeVis = savedVis["Hillshade"] ? "visible" : "none";
            var contourVis = savedVis["Contours"] ? "visible" : "none";
            var isImperial = currentScale === "imperial";
            var elevUnit = isImperial ? "ft" : "m";

            sources["terrain-dem"] = {
                type: "raster-dem",
                url: "pmtiles://" + window.location.origin + dataPath(terrainFileName),
                encoding: "terrarium",
                tileSize: 512,
            };

            var hillshadeSearch = allLayers.findIndex(function(l) { return l.id === "buildings"; });
            var hillshadeIdx = hillshadeSearch === -1 ? allLayers.length : hillshadeSearch;
            allLayers.splice(hillshadeIdx, 0, {
                id: "hillshade",
                type: "hillshade",
                source: "terrain-dem",
                layout: {visibility: hillshadeVis},
                paint: {
                    "hillshade-shadow-color": "#000000",
                    "hillshade-illumination-anchor": "viewport",
                    "hillshade-exaggeration": 0.3,
                },
            });

            var contourUrl = demSource.contourProtocolUrl({
                overzoom: 1,
                contourLayer: "contours",
                elevationKey: "ele",
                levelKey: "level",
                multiplier: isImperial ? 3.28084 : 1,
                thresholds: isImperial ? {
                    4: [1000, 5000], 5: [500, 2500], 6: [200, 1000], 7: [200, 1000], 8: [100, 500],
                } : {
                    4: [500, 2500], 5: [200, 1000], 6: [100, 500], 7: [100, 500], 8: [50, 200],
                },
            });
            sources["contours"] = { type: "vector", tiles: [contourUrl], maxzoom: 8 };

            var textColor = flavor === "dark" ? "rgba(210,180,140,0.9)" : "rgba(150,100,50,0.8)";
            var haloColor = flavor === "dark" ? "rgba(0,0,0,0.8)" : "rgba(255,255,255,0.8)";

            allLayers.push(
                {
                    id: "contour-lines", type: "line", source: "contours", "source-layer": "contours",
                    filter: ["!=", ["get", "level"], 1],
                    layout: {visibility: contourVis},
                    paint: {"line-color": "rgba(150,100,50,0.3)", "line-width": 0.5},
                },
                {
                    id: "contour-lines-major", type: "line", source: "contours", "source-layer": "contours",
                    filter: ["==", ["get", "level"], 1],
                    layout: {visibility: contourVis},
                    paint: {"line-color": "rgba(150,100,50,0.5)", "line-width": 1},
                },
                {
                    id: "contour-labels", type: "symbol", source: "contours", "source-layer": "contours",
                    filter: ["==", ["get", "level"], 1],
                    layout: {
                        visibility: contourVis,
                        "symbol-placement": "line",
                        "text-field": ["concat", ["get", "ele"], elevUnit],
                        // A font the map has glyphs for; MapLibre's default is not one of them.
                        "text-font": ["Noto Sans Regular"],
                        "text-size": 10,
                    },
                    paint: {"text-color": textColor, "text-halo-color": haloColor, "text-halo-width": 1},
                }
            );
        }

        return {
            version: 8,
            glyphs: "/fonts/{fontstack}/{range}.pbf",
            sprite: window.location.origin + "/sprites/" + flavor,
            sources: sources,
            layers: allLayers,
        };
    }

    // --- Parse URL hash for coordinates ---
    function parseHash() {
        var hash = window.location.hash.replace("#", "");
        if (!hash) return null;
        var parts = hash.split(",");
        if (parts.length >= 2) {
            var lat = parseFloat(parts[0]);
            var lon = parseFloat(parts[1]);
            var zoom = parts.length >= 3 ? parseFloat(parts[2]) : 10;
            if (!isNaN(lat) && !isNaN(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
                return {lat: lat, lon: lon, zoom: zoom};
            }
        }
        return null;
    }

    function initMap() {
        var initial = parseHash();
        var center = initial ? [initial.lon, initial.lat] : [0, 0];
        var zoom = initial ? initial.zoom : 2;

        map = new maplibregl.Map({
            container: "map",
            style: buildStyle(),
            center: center,
            zoom: zoom,
            attributionControl: true,
            preserveDrawingBuffer: true,
        });

        map.addControl(new maplibregl.NavigationControl(), "top-right");
        map.addControl(new maplibregl.FullscreenControl(), "top-right");
        scaleControl = new maplibregl.ScaleControl({maxWidth: 200, unit: currentScale});
        map.addControl(scaleControl, "bottom-left");

        var geolocate = new maplibregl.GeolocateControl({
            positionOptions: {enableHighAccuracy: true},
            trackUserLocation: true,
            showUserHeading: true,
            showAccuracyCircle: true,
        });
        map.addControl(geolocate, "top-right");

        // Update URL hash on pan/zoom.
        map.on("moveend", function() {
            var c = map.getCenter();
            var z = map.getZoom();
            window.location.hash = c.lat.toFixed(4) + "," + c.lng.toFixed(4) + "," + z.toFixed(1);
        });

        // Right-click context menu.
        map.on("contextmenu", function(e) {
            contextMenuData = {lat: e.lngLat.lat, lon: e.lngLat.lng};
            var menu = document.getElementById("context-menu");
            var z = map.getZoom();
            var d = z < 4 ? 1 : z < 8 ? 2 : z < 12 ? 3 : 4;
            document.getElementById("context-coords").textContent =
                contextMenuData.lat.toFixed(d) + ", " + contextMenuData.lon.toFixed(d);
            menu.style.left = e.point.x + "px";
            menu.style.top = e.point.y + "px";
            menu.style.display = "block";
        });
        map.on("click", function() { document.getElementById("context-menu").style.display = "none"; });

        // Click an overlay's feature to see its attributes.
        map.on("click", function(e) {
            var layers = overlayLayerIds();
            if (!layers.length) return;
            var html = Overlays.overlayPopupHtml(map.queryRenderedFeatures(e.point, {layers: layers}));
            if (!html) return;
            new maplibregl.Popup({offset: 8, maxWidth: "260px"}).setLngLat(e.lngLat).setHTML(html).addTo(map);
        });
        map.on("mousemove", function(e) {
            var layers = overlayLayerIds();
            var hit = layers.length && map.queryRenderedFeatures(e.point, {layers: layers}).length;
            map.getCanvas().style.cursor = hit ? "pointer" : "";
        });
        // A name the overlay icons do not have is drawn as a plain dot.
        map.on("styleimagemissing", function(e) {
            if (OverlayStyle) OverlayStyle.addMissingOverlayIcon(map, e.id);
        });
        // A layer MapLibre refuses (an overlay's style may have one) is reported, not fatal.
        map.on("error", function(e) { console.warn("Map error:", e && e.error ? e.error.message : e); });
        map.on("movestart", function() { document.getElementById("context-menu").style.display = "none"; });

        // Long-press context menu (mobile).
        var longPressTimer = null;
        var touchStartPos = null;
        var canvas = map.getCanvas();
            canvas.addEventListener("touchstart", function(e) {
                if (e.touches.length !== 1) return;
                touchStartPos = {x: e.touches[0].clientX, y: e.touches[0].clientY};
                longPressTimer = setTimeout(function() {
                    var rect = canvas.getBoundingClientRect();
                    var px = touchStartPos.x - rect.left;
                    var py = touchStartPos.y - rect.top;
                    var lngLat = map.unproject([px, py]);
                    contextMenuData = {lat: lngLat.lat, lon: lngLat.lng};
                    var menu = document.getElementById("context-menu");
                    var z = map.getZoom();
                    var d = z < 4 ? 1 : z < 8 ? 2 : z < 12 ? 3 : 4;
                    document.getElementById("context-coords").textContent =
                        contextMenuData.lat.toFixed(d) + ", " + contextMenuData.lon.toFixed(d);
                    menu.style.left = px + "px";
                    menu.style.top = py + "px";
                    menu.style.display = "block";
                }, 500);
            }, {passive: true});
            canvas.addEventListener("touchmove", function(e) {
                if (longPressTimer && touchStartPos) {
                    var dx = e.touches[0].clientX - touchStartPos.x;
                    var dy = e.touches[0].clientY - touchStartPos.y;
                    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                        clearTimeout(longPressTimer);
                        longPressTimer = null;
                    }
                }
            });
            canvas.addEventListener("touchend", function() {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            });
        map.on("load", function() {
            applyOverlays();
            buildLayerControls();
        });
    }

    // --- Context menu copy ---
    document.getElementById("context-copy").addEventListener("click", function() {
        if (!contextMenuData || !map) return;
        var z = map.getZoom();
        var d = z < 4 ? 1 : z < 8 ? 2 : z < 12 ? 3 : 4;
        var text = contextMenuData.lat.toFixed(d) + ", " + contextMenuData.lon.toFixed(d);
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).catch(function() {
                window.prompt("Copy coordinates:", text);
            });
        } else {
            window.prompt("Copy coordinates:", text);
        }
        document.getElementById("context-menu").style.display = "none";
    });

    // --- Context menu export ---
    document.getElementById("context-export").addEventListener("click", function() {
        if (!map) return;
        document.getElementById("context-menu").style.display = "none";
        // Force a fresh render, then capture.
        map.once("render", function() {
            var c = map.getCenter();
            var z = map.getZoom();
            var filename = "wrolpi-map_" + c.lat.toFixed(4) + "_" + c.lng.toFixed(4) + "_z" + z.toFixed(0) + ".png";
            map.getCanvas().toBlob(function(blob) {
                if (!blob) return;
                var url = URL.createObjectURL(blob);
                var a = document.createElement("a");
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            });
        });
        map.triggerRepaint();
    });

    // --- Layer control ---
    function matchesGroup(layerId, prefixes) {
        // An overlay's layers belong to no basemap group, whatever they are named.
        if (layerId.indexOf("overlay:") === 0) return false;
        var baseId = layerId.indexOf(":") >= 0 ? layerId.split(":").slice(1).join(":") : layerId;
        return prefixes.some(function(prefix) {
            return baseId.indexOf(prefix) >= 0;
        });
    }

    function setGroupVisibility(groupName, visible) {
        groupVisibility[groupName] = visible;
        try { localStorage.setItem(STORAGE_KEY_LAYERS, JSON.stringify(groupVisibility)); } catch(e) {}
        if (!map || !map.getStyle()) return;
        var prefixes = LAYER_GROUPS[groupName];
        var allLayers = map.getStyle().layers || [];
        for (var i = 0; i < allLayers.length; i++) {
            if (matchesGroup(allLayers[i].id, prefixes)) {
                map.setLayoutProperty(allLayers[i].id, "visibility", visible ? "visible" : "none");
            }
        }
    }

    function buildLayerControls() {
        var container = document.getElementById("layer-content");
        container.innerHTML = "";

        for (var groupName in LAYER_GROUPS) {
            var div = document.createElement("div");
            div.className = "layer-group";

            var header = document.createElement("label");
            header.className = "layer-group-header";

            var checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = groupVisibility[groupName] !== false;
            checkbox.addEventListener("change", (function(name) {
                return function(e) { setGroupVisibility(name, e.target.checked); };
            })(groupName));

            var label = document.createTextNode(groupName);
            header.appendChild(checkbox);
            header.appendChild(label);
            div.appendChild(header);
            container.appendChild(div);
        }

        buildOverlayControls(container);

        // Scale unit toggle.
        var scaleDiv = document.createElement("div");
        scaleDiv.className = "layer-group";
        scaleDiv.style.borderTop = "1px solid #eee";
        scaleDiv.style.marginTop = "4px";
        scaleDiv.style.paddingTop = "4px";

        var scaleLabel = document.createElement("label");
        scaleLabel.className = "layer-group-header";

        var scaleCheckbox = document.createElement("input");
        scaleCheckbox.type = "checkbox";
        scaleCheckbox.checked = currentScale === "imperial";
        scaleCheckbox.addEventListener("change", function(e) {
            currentScale = e.target.checked ? "imperial" : "metric";
            scaleText.textContent = e.target.checked ? "Imperial" : "Metric";
            try { localStorage.setItem(STORAGE_KEY_SCALE, currentScale); } catch(e2) {}
            if (map && scaleControl) {
                map.removeControl(scaleControl);
                scaleControl = new maplibregl.ScaleControl({maxWidth: 200, unit: currentScale});
                map.addControl(scaleControl, "bottom-left");
            }
            // Rebuild style for contour unit change.
            if (hasTerrain) reloadMap();
        });

        var scaleText = document.createTextNode(currentScale === "imperial" ? "Imperial" : "Metric");
        scaleLabel.appendChild(scaleCheckbox);
        scaleLabel.appendChild(scaleText);
        scaleDiv.appendChild(scaleLabel);
        container.appendChild(scaleDiv);
    }

    function checkboxLabel(className, text, checked, onChange) {
        var label = document.createElement("label");
        label.className = className;
        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = checked;
        checkbox.addEventListener("change", function(e) { onChange(e.target.checked); });
        label.appendChild(checkbox);
        return {label: label, checkbox: checkbox, text: label.appendChild(document.createElement("span"))};
    }

    function textButton(text, onClick) {
        var button = document.createElement("button");
        button.type = "button";
        button.textContent = text;
        button.addEventListener("click", onClick);
        return button;
    }

    // One overlay file: a checkbox for the file, and (for a vector file) one per layer behind an
    // arrow.  An overlay is hidden until it is turned on.
    function buildOverlayControl(file) {
        var label = Overlays.overlayLabel(file, overlayFiles);
        var enabled = Overlays.isOverlayEnabled(overlayState, file);
        var layers = Overlays.overlayToggleLayers(file);
        var styled = Overlays.isStyledOverlay(file);
        var expanded = !!overlayExpanded[file.map_path];
        var fragment = document.createDocumentFragment();

        var row = document.createElement("div");
        row.className = "overlay-file";
        row.title = [file.description, file.map_path].filter(Boolean).join("\n");
        var fileBox = checkboxLabel("", label, enabled, function(checked) {
            changeOverlayState(file, Overlays.setOverlayEnabled(overlayState, file, checked));
        });
        fileBox.text.textContent = label;
        row.appendChild(fileBox.label);
        if (isFinite(file.min_zoom) && isFinite(file.max_zoom) && file.min_zoom !== null) {
            var zooms = document.createElement("span");
            zooms.className = "overlay-zooms";
            zooms.textContent = "z" + file.min_zoom + "\u2013" + file.max_zoom;
            row.appendChild(zooms);
        }
        if (layers.length) {
            var expand = textButton(expanded ? "\u25BC" : "\u25B6", function() {
                overlayExpanded[file.map_path] = !expanded;
                buildLayerControls();
            });
            expand.className = "overlay-expand";
            expand.setAttribute("aria-label", (expanded ? "Hide" : "Show") + " layers of " + label);
            expand.setAttribute("aria-expanded", expanded ? "true" : "false");
            row.appendChild(expand);
        }
        fragment.appendChild(row);
        if (!expanded || !layers.length) return fragment;

        var list = document.createElement("div");
        list.className = "overlay-layers";
        var allNone = document.createElement("div");
        allNone.className = "overlay-all-none";
        allNone.appendChild(textButton("All", function() {
            changeOverlayState(file, Overlays.setAllOverlayLayersEnabled(overlayState, file, true));
        }));
        allNone.appendChild(textButton("None", function() {
            changeOverlayState(file, Overlays.setAllOverlayLayersEnabled(overlayState, file, false));
        }));
        list.appendChild(allNone);

        // Layers of its style the map could not use: found when the style was read, or refused
        // by MapLibre when added.
        var skipped = (file.styleSkipped || 0) + (overlayRefused[file.map_path] || 0);
        if (skipped) {
            var note = document.createElement("div");
            note.className = "overlay-note";
            note.textContent = skipped + " style " + (skipped === 1 ? "layer" : "layers") + " skipped";
            list.appendChild(note);
        }

        layers.forEach(function(layer) {
            var box = checkboxLabel("overlay-layer" + (enabled ? "" : " disabled"), layer.id,
                Overlays.isOverlayLayerEnabled(overlayState, file, layer.id), function(checked) {
                    changeOverlayState(file,
                        Overlays.setOverlayLayerEnabled(overlayState, file, layer.id, checked));
                });
            box.checkbox.disabled = !enabled;
            if (layer.description) box.label.title = layer.description;
            // A generic layer is drawn in one color; a styled one however its style says.
            if (!styled) {
                var swatch = document.createElement("span");
                swatch.className = "overlay-swatch";
                swatch.style.background = Overlays.overlayColor(layer.id);
                box.label.insertBefore(swatch, box.text);
            }
            box.text.textContent = layer.id;
            list.appendChild(box.label);
        });
        fragment.appendChild(list);
        return fragment;
    }

    function buildOverlayControls(container) {
        if (!Overlays || !overlayFiles.length) return;
        var section = document.createElement("div");
        section.id = "overlay-section";
        var title = document.createElement("h4");
        title.textContent = "Overlays";
        section.appendChild(title);
        overlayFiles.forEach(function(file) { section.appendChild(buildOverlayControl(file)); });
        container.appendChild(section);
    }

    // Toggle layer panel
    document.getElementById("layer-toggle").addEventListener("click", function() {
        var content = document.getElementById("layer-content");
        var arrow = this.querySelector(".arrow");
        content.classList.toggle("hidden");
        arrow.classList.toggle("collapsed");
    });

    // --- File management ---
    function showStatus(msg) {
        var el = document.getElementById("status");
        el.textContent = msg;
        el.style.display = "block";
        setTimeout(function() { el.style.display = "none"; }, 3000);
    }

    function reloadMap() {
        if (!map) { initMap(); return; }

        var center = map.getCenter();
        var zoom = map.getZoom();
        var bearing = map.getBearing();
        var pitch = map.getPitch();

        map.setStyle(buildStyle());

        map.once("style.load", function() {
            map.setCenter(center);
            map.setZoom(zoom);
            map.setBearing(bearing);
            map.setPitch(pitch);
            // Re-apply visibility for groups that were toggled off.
            for (var groupName in groupVisibility) {
                if (!groupVisibility[groupName]) {
                    setGroupVisibility(groupName, false);
                }
            }
            applyOverlays();
            buildLayerControls();
        });
    }

    function toggleFile(filename, enabled) {
        if (enabled) { activeSources[filename] = true; }
        else { delete activeSources[filename]; }
        reloadMap();
        showStatus(enabled ? "Added " + filename : "Removed " + filename);
    }

    function renderFileList(files) {
        var container = document.getElementById("file-list");
        container.innerHTML = "";

        if (files.length === 0) {
            container.innerHTML = '<div id="no-files-msg">No .pmtiles files found in map/ directory</div>';
            return;
        }

        files.forEach(function(file) {
            var div = document.createElement("div");
            div.className = "file-item";

            var checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.id = "file-" + file;
            checkbox.checked = !!activeSources[file];
            checkbox.addEventListener("change", function(e) {
                toggleFile(file, e.target.checked);
            });

            var label = document.createElement("label");
            label.htmlFor = "file-" + file;
            label.textContent = file;

            div.appendChild(checkbox);
            div.appendChild(label);
            container.appendChild(div);
        });
    }

    function scanFiles() {
        // Fetch user's map files first to determine what base layer is needed.
        fetch("/api/map/files")
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var allFiles = (data.files || []).sort(function(a, b) { return a.name.localeCompare(b.name); });

                // Separate files into planet, terrain, and regional extracts.
                var planetFile = null;
                var regionFiles = [];
                var overlayCandidates = [];
                for (var i = 0; i < allFiles.length; i++) {
                    var f = allFiles[i];
                    // A file the user ignores is not drawn.
                    if (f.visible === false) continue;
                    // A file is named by its path in the map directory; it may be in a sub-directory.
                    f.mapPath = f.map_path || f.name;
                    var isTerrain = f.kind ? f.kind === "terrain"
                        : (f.name.startsWith(TERRAIN_PREFIX) && f.name.endsWith('.pmtiles'));
                    if (isTerrain) {
                        terrainFileName = f.mapPath;
                        hasTerrain = true;
                    } else if (f.kind === "overlay") {
                        // Not the basemap schema: offered in the layer panel, drawn as itself.
                        overlayCandidates.push(f);
                    } else if (f.kind && f.kind !== "basemap") {
                        // An unreadable file is not drawn.
                        continue;
                    } else if (isPlanetFile(f.name)) {
                        if (!planetFile || f.size > planetFile.size) {
                            planetFile = f;
                        }
                    } else {
                        regionFiles.push(f);
                    }
                }

                var pmtilesFiles;
                if (planetFile) {
                    // Planet covers everything — sole vector source, no overview needed.
                    pmtilesFiles = [planetFile.mapPath];
                    hasPlanetOverview = false;
                    return loadOverlays(overlayCandidates).then(function() { return pmtilesFiles; });
                }

                // Use regional extracts.
                pmtilesFiles = regionFiles.map(function(f) { return f.mapPath; });

                // Check for planet overview blob as low-zoom base layer.
                return fetch(MAP_OVERVIEW_URL, {method: "HEAD"})
                    .then(function(r) { hasPlanetOverview = r.ok; })
                    .catch(function() { hasPlanetOverview = false; })
                    .then(function() { return loadOverlays(overlayCandidates); })
                    .then(function() { return pmtilesFiles; });
            })
            .then(function(pmtilesFiles) {

                // Initialize contour source if terrain available.
                if (hasTerrain && !demSource) {
                    demSource = new mlcontour.DemSource({
                        url: "pmtiles://" + window.location.origin + dataPath(terrainFileName),
                        encoding: "terrarium",
                        maxzoom: 8,
                        worker: true,
                    });
                    demSource.setupMaplibre(maplibregl);
                }

                renderFileList(pmtilesFiles);

                if (pmtilesFiles.length > 0 && Object.keys(activeSources).length === 0) {
                    activeSources[pmtilesFiles[0]] = true;
                    renderFileList(pmtilesFiles);
                    reloadMap();
                } else if (hasPlanetOverview || hasTerrain) {
                    reloadMap();
                } else if (Object.keys(activeSources).length === 0) {
                    initMap();
                }
            })
            .catch(function(err) {
                console.error("Failed to scan files:", err);
                document.getElementById("file-list").innerHTML =
                    '<div id="no-files-msg">Error scanning for map files</div>';
                initMap();
            });
    }

    // --- Listen for system theme changes ---
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function() {
        if (map) reloadMap();
    });

    // --- Search ---
    var searchInput = document.getElementById("search-input");
    var searchResults = document.getElementById("search-results");
    var searchTimeout = null;
    var searchMarker = null;
    var coordRegex = /^\s*(-?\d+\.?\d*)\s*[,\s]\s*(-?\d+\.?\d*)\s*$/;

    searchInput.addEventListener("input", function() {
        clearTimeout(searchTimeout);
        var query = this.value.trim();
        if (query.length < 2) {
            searchResults.style.display = "none";
            return;
        }

        // Check for coordinate input.
        var coordMatch = query.match(coordRegex);
        if (coordMatch) {
            var cLat = parseFloat(coordMatch[1]);
            var cLon = parseFloat(coordMatch[2]);
            if (cLat >= -90 && cLat <= 90 && cLon >= -180 && cLon <= 180) {
                searchResults.innerHTML = "";
                var div = document.createElement("div");
                div.className = "search-result";
                var nameEl = document.createElement("div");
                nameEl.className = "search-result-name";
                nameEl.textContent = cLat + ", " + cLon;
                div.appendChild(nameEl);
                var kindEl = document.createElement("div");
                kindEl.className = "search-result-kind";
                kindEl.textContent = "coordinates";
                div.appendChild(kindEl);
                div.onclick = function() { goToResult(cLat, cLon, cLat + ", " + cLon); };
                searchResults.appendChild(div);
                searchResults.style.display = "block";
                return;
            }
        }

        searchTimeout = setTimeout(function() {
            var url = "/api/map/search?q=" + encodeURIComponent(query) + "&limit=8";
            if (map) {
                var center = map.getCenter();
                url += "&lat=" + center.lat + "&lon=" + center.lng;
            }
            fetch(url).then(function(r) { return r.json(); }).then(function(data) {
                searchResults.innerHTML = "";
                var results = data.results || [];
                if (results.length > 0) {
                    results.forEach(function(r) {
                        var div = document.createElement("div");
                        div.className = "search-result";
                        var parts = [];
                        if (r.region) parts.push(r.region);
                        var detail = r.kind_detail || r.kind || "";
                        if (detail && !r.region) parts.push(detail.replace(/_/g, " "));
                        if (r.population) {
                            var pop = r.population >= 1000000 ? (r.population / 1000000).toFixed(1) + "M"
                                : r.population >= 1000 ? Math.round(r.population / 1000) + "K"
                                : "" + r.population;
                            parts.push("pop. " + pop);
                        }
                        var subtitle = parts.join(" \u00b7 ");
                        var nameEl = document.createElement("div");
                        nameEl.className = "search-result-name";
                        nameEl.textContent = r.name;
                        div.appendChild(nameEl);
                        if (subtitle) {
                            var kindEl = document.createElement("div");
                            kindEl.className = "search-result-kind";
                            kindEl.textContent = subtitle;
                            div.appendChild(kindEl);
                        }
                        div.onclick = function() { goToResult(r.lat, r.lon, r.name); };
                        searchResults.appendChild(div);
                    });
                    searchResults.style.display = "block";
                } else {
                    searchResults.style.display = "none";
                }
            }).catch(function() { searchResults.style.display = "none"; });
        }, 300);
    });

    searchInput.addEventListener("keydown", function(e) {
        if (e.key === "Escape") {
            searchResults.style.display = "none";
            searchInput.blur();
        }
    });

    document.addEventListener("click", function(e) {
        if (!document.getElementById("search-container").contains(e.target)) {
            searchResults.style.display = "none";
        }
    });

    function goToResult(lat, lon, name) {
        if (!map) return;
        if (searchMarker) { searchMarker.remove(); searchMarker = null; }
        var zoom = Math.max(map.getZoom(), 12);
        map.flyTo({center: [lon, lat], zoom: zoom});
        searchMarker = new maplibregl.Marker({color: "#6435c9"})
            .setLngLat([lon, lat])
            .setPopup(new maplibregl.Popup({offset: 25}).setText(name))
            .addTo(map);
        searchMarker.togglePopup();
        searchResults.style.display = "none";
        searchInput.value = name;
    }

    // --- Start ---
    scanFiles();
})();
</script>
</body>
</html>
