# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/2.0/configuration-reference/#jobs
jobs:
  api-tests:
    docker:
      - image: cimg/python:3.13
    # `large` (4 vCPU, 8 GB) so pytest-xdist's `-nauto` has room to scale.
    resource_class: large
    steps:
      - checkout
      - run: sudo apt-get update
      - run: sudo apt-get install -y ffmpeg catdoc
      - restore_cache:
          key: deps-3.13-{{ checksum "requirements.txt" }}-5
      - run:
          name: Install Requirements
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install -r requirements.txt
      - save_cache:
          key: deps-3.13-{{ checksum "requirements.txt" }}-5
          paths:
            - "venv"
      # `-nauto` parallelizes across all available cores via pytest-xdist.
      # `-svv` was dumping the full test stdout to CircleCI logs on every run,
      # which inflated wall time and produced multi-MB log artifacts; dropped.
      - run:
          command: './venv/bin/pytest -nauto --junitxml=test-results.xml'
      - store_test_results:
          path: test-results.xml
  # Do the API and the frontend's test fixtures still agree?
  #
  # `api-tests` runs these too, as part of the whole suite.  This job exists for the
  # signal: fixture drift is silent by nature -- the frontend suite passes against a body the
  # API stopped sending -- so it is worth a check whose name says what broke, failing in under a
  # minute rather than somewhere inside seventeen hundred results.
  #
  # It needs no ffmpeg or catdoc (verified), and shares the dependency cache key with the other
  # Python jobs, so it costs a venv restore and one test file.
  api-contract-tests:
    docker:
      - image: cimg/python:3.11
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          key: deps-3.11-{{ checksum "requirements.txt" }}-5
      - run:
          name: Install Requirements
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install -r requirements.txt
      - run:
          name: Fixtures match the OpenAPI spec, and the spec matches the handlers
          command: './venv/bin/pytest wrolpi/test/test_api_fixtures.py -v'

  api-alembic-migrations:
    docker:
      - image: cimg/python:3.13
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          key: deps-3.13-{{ checksum "requirements.txt" }}-5
      - run:
          name: Install Requirements
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install -r requirements.txt
      - run:
          name: Create Media Directory
          command: mkdir -p /tmp/wrolpi-media/config
      - run:
          name: Run Alembic Migrations
          command: MEDIA_DIRECTORY=/tmp/wrolpi-media ./venv/bin/python ./main.py db upgrade
      - run:
          name: Check for Missing Migrations
          command: MEDIA_DIRECTORY=/tmp/wrolpi-media ./venv/bin/python ./main.py db check
  sanic-api-start:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - restore_cache:
          key: deps-3.13-{{ checksum "requirements.txt" }}-5
      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install -r requirements.txt
            sudo mkdir -p /media/wrolpi
      - run:
          name: Start Sanic API
          command: |
            . venv/bin/activate
            sanic main:api_app -H 0.0.0.0 -p 8081
          background: true
      - run:
          name: Test Sanic API
          command: |
            sleep 20
            curl http://0.0.0.0:8081/api/echo
      - run:
          name: Stop Sanic API
          command: pkill -f sanic
  react-app-start:
    docker:
      - image: cimg/node:20.19
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          key: app-{{ checksum "app/package-lock.json" }}
      - run: cd app && npm install
      - save_cache:
          key: app-{{ checksum "app/package-lock.json" }}
          paths:
            - ./app/node_modules
      - run:
          name: Build React App
          command: cd app && DISABLE_ESLINT_PLUGIN=true npm run build
      - run:
          name: Start React App
          command: cd app && DISABLE_ESLINT_PLUGIN=true npm run start
          background: true
      - run:
          name: Test React App
          command: |
            sleep 20
            curl http://0.0.0.0:3000/manifest.json
      - run:
          name: Stop React App
          command: pkill -f npm
  # Jest tests moved to GitHub Actions (.github/workflows/jest-tests.yml)
  cypress-e2e-tests:
    docker:
      - image: cimg/node:20.19-browsers
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          key: app-browsers-{{ checksum "app/package-lock.json" }}
      - run:
          name: Install Dependencies
          command: cd app && npm install
      # The Cypress binary lives outside node_modules, so caching only
      # node_modules lets the two drift apart: a restored cache satisfies npm,
      # npm skips the postinstall download, and the binary for the new version
      # is never fetched.  Cache both, and install explicitly (a no-op when the
      # binary is already present).
      - run:
          name: Install Cypress Binary
          command: cd app && npx cypress install
      - save_cache:
          key: app-browsers-{{ checksum "app/package-lock.json" }}
          paths:
            - ./app/node_modules
            - ~/.cache/Cypress
      - run:
          name: Start React App in Background
          command: cd app && DISABLE_ESLINT_PLUGIN=true npm start
          background: true
      - run:
          name: Wait for React App
          command: |
            for i in {1..60}; do
              if curl -s http://localhost:3000 > /dev/null; then
                echo "React app is ready!"
                exit 0
              fi
              echo "Waiting for React app... ($i/60)"
              sleep 2
            done
            echo "React app failed to start"
            exit 1
      - run:
          name: Run Cypress Tests
          command: cd app && CI=true npx cypress run
      - store_artifacts:
          path: app/cypress/videos
      - store_artifacts:
          path: app/cypress/screenshots

workflows:
  wrolpi-api-tests:
    jobs:
      - sanic-api-start
      - api-tests
      - api-contract-tests
      - api-alembic-migrations
  wrolpi-app-test:
    jobs:
      - react-app-start
      # jest-tests moved to GitHub Actions
      - cypress-e2e-tests
