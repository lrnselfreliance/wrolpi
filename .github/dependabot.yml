version: 2
updates:
  # Python - root (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "master"
    open-pull-requests-limit: 5
    ignore:
      # alembic >=1.11 requires SQLAlchemy 2; requirements.txt pins SQLAlchemy 1.3.
      # Grouped PRs containing it fail to install, so hold alembic until the
      # SQLAlchemy 2 migration lands.
      - dependency-name: "alembic"
        versions: [">=1.11"]
      - dependency-name: "SQLAlchemy"
        update-types: ["version-update:semver-major"]
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Python - controller
  - package-ecosystem: "pip"
    directory: "/controller"
    schedule:
      interval: "monthly"
    target-branch: "master"
    open-pull-requests-limit: 5
    groups:
      controller-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # npm - app
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "monthly"
    target-branch: "master"
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
