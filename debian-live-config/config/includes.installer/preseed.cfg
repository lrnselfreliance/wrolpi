# Debian installer defaults.  live-build copies this into the installer's
# initrd, where d-i loads /preseed.cfg automatically.
#
# Default the hostname to wrolpi (Debian's default is "debian"), as on the live
# session and the Pi: it names the TLS certificate, the SMB/NetBIOS share, and
# the DHCP hostname a router may publish.  "seen false" keeps the question on
# screen, so it can still be changed; a hostname from DHCP takes precedence.
d-i netcfg/get_hostname string wrolpi
d-i netcfg/get_hostname seen false
